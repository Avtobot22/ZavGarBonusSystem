[versions]
# Project
version_code = "30402"
version_name = "1.0.0"
android_gradle_plugin = "9.2.0"
kotlin = "2.3.21"
android_sdk_compile = "37"
android_sdk_target = "36"
android_sdk_min = "24"

# General dependencies
logging = "3.0.5"
logcat = "0.4"

# KotlinX
kotlinx_coroutines = "1.11.0"
kotlinx_serialization = "1.11.0"
kotlinx_collections_immutable = "0.4.0"
kotlinx_datetime = "0.8.0"

# AndroidX
activity = "1.13.0"
appcompat = "1.7.1"
datastore = "1.2.1"
security_crypto = "1.1.0"
lifecycle_viewmodel = "2.10.0"
lifecycle_runtime = "2.10.0"

# Compose
compose_compiler = "1.10.3"
compose_runtime = "1.10.3"
compose_material = "1.10.3"
compose_material3 = "1.10.0-alpha05"
compose_components_resources = "1.10.3"
compose_materialIconsExtended = "1.7.3"
compose_uiTooling = "1.10.1"
compose_uiToolingPreview = "1.10.1"
compose_navigation = "1.0.0-alpha06"
compose_adaptive = "1.3.0-alpha03"

# Koin
koin = "4.2.1"

material = "1.14.0"

# Ktor
ktor = "3.5.0"

#Qr-kit
qrKit = "3.1.3"
kotlinStdlib = "2.3.21"
kotlinTest = "2.3.21"
runner = "1.7.0"
core = "1.7.0"
junit = "1.3.0"
mockk = "1.14.2"
turbine = "1.2.1"
kover = "0.9.8"

# Firebase
googleServices = "4.4.4"
firebaseCrashlyticsPlugin = "3.0.7"
# GitLive Firebase KMP SDK. ВНИМАНИЕ: 2.4.0 собран под Kotlin ~2.1 —
# при несовместимости с Kotlin 2.3.21 поднять версию.
gitliveFirebase = "2.4.0"
# BOM нужен, чтобы GitLive android-артефакты получили версии нативного Firebase SDK.
firebaseBom = "34.13.0"

[libraries]
# Project
android_gradle_plugin = { module = "com.android.tools.build:gradle", version.ref = "android_gradle_plugin" }
kotlin_gradle_plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kover_gradle_plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

# General dependencies
logging = { module = "io.github.microutils:kotlin-logging", version.ref = "logging" }
logcat = { module = "com.squareup.logcat:logcat", version.ref = "logcat" }

# KotlinX
kotlinx_coroutines_core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx_coroutines" }
kotlinx_serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx_serialization" }
kotlinx_collections_immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx_collections_immutable" }
kotlinx_datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx_datetime" }

# AndroidX
androidx_activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx_activity_compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx_appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx_datastore = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
androidx_security_crypto = { module = "androidx.security:security-crypto", version.ref = "security_crypto" }
androidx_lifecycle_viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle_viewmodel" }
androidx_lifecycle_runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle_runtime" }
androidx_lifecycle_compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle_runtime" }

#Compose
compose_runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose_runtime" }
compose_material = { module = "org.jetbrains.compose.material:material", version.ref = "compose_material" }
compose_material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose_material3" }
compose_components_resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose_components_resources" }
compose_materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose_materialIconsExtended" }
compose_uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose_uiTooling" }
compose_uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose_uiToolingPreview" }
compose_navigation_ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "compose_navigation" }
compose_navigation_adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "compose_adaptive" }

#Koin
koin_core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin_compose = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# --- Ktor Core & Logic ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- Ktor Engines (Движки для платформ) ---
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# Qr-kit
qrKit = { module = "network.chaintech:qr-kit", version.ref = "qrKit" }

# Firebase (GitLive KMP SDK)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
gitlive-firebase-config = { module = "dev.gitlive:firebase-config", version.ref = "gitliveFirebase" }
gitlive-firebase-crashlytics = { module = "dev.gitlive:firebase-crashlytics", version.ref = "gitliveFirebase" }
gitlive-firebase-analytics = { module = "dev.gitlive:firebase-analytics", version.ref = "gitliveFirebase" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlinTest" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx_coroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
core = { group = "androidx.test", name = "core", version.ref = "core" }
junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }

[plugins]
android_kmp_plugin = { id = "com.android.kotlin.multiplatform.library", version.ref = "android_gradle_plugin" }
kotlin_serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose_compiler" }
compose_compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

zavgar-multiplatform = { id = "com.zavgar.system.multiplatform" }
zavgar-parcelable = { id = "com.zavgar.system.kotlin-parcelable" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-lint = { id = "com.android.lint", version.ref = "android_gradle_plugin" }