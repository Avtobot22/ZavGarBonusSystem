name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to publish detekt SARIF to GitHub code scanning

jobs:
  verify:
    name: Detekt · Build · Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --- Static analysis (gate) ---
      - name: Detekt
        run: ./gradlew detekt

      # Collect the per-module SARIF files into one folder (unique names) for code scanning.
      - name: Collect detekt SARIF
        if: success() || failure()
        run: |
          mkdir -p build/sarif
          find . -path '*/build/reports/detekt/*.sarif' -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "build/sarif/$(echo "${f#./}" | tr '/.' '__').sarif"
              done

      - name: Upload detekt SARIF to code scanning
        if: success() || failure()
        continue-on-error: true   # don't fail the gate if code scanning is unavailable
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/sarif

      # --- Build (gate) ---
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # --- Tests (gate) ---
      - name: Unit tests
        run: ./gradlew testAndroidHostTest :app:testDebugUnitTest

      - name: Coverage report (Kover)
        if: success() || failure()
        run: ./gradlew koverXmlReport

      # --- Artifacts ---
      - name: Upload reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/tests/**
            build/reports/kover/**
          if-no-files-found: ignore
          retention-days: 14
